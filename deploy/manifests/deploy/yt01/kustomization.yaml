apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-profile
resources:
  - ../base

patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: altinn-profile
      spec:
        hostnames:
          - profile.yt01.dis-core.altinn.cloud
