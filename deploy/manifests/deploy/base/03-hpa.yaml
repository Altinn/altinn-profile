apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: altinn-profile
  labels:
    app.kubernetes.io/name: altinn-profile
    app.kubernetes.io/instance: altinn-profile
    app: altinn-profile
    release: altinn-profile
    team: core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: altinn-profile
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
