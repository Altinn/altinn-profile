# spec.hostnames is added per environment by a patch in the deploy/<env> overlays
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: altinn-profile
  labels:
    app.kubernetes.io/name: altinn-profile
    app.kubernetes.io/part-of: altinn-profile
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /profile
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: l5d-dst-override
                value: altinn-profile.product-profile.svc.cluster.local:80
      backendRefs:
        - name: altinn-profile
          port: 80
