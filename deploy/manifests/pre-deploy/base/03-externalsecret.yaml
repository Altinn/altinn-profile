apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: profile-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    # Created by the Vault operator as <vault-name>-secret-store. Kustomize doesn't know
    # this reference, so the prefixed name is written out in full.
    name: altinn-profile-secret-store
  target:
    creationPolicy: Owner
  data:
    - secretKey: PostgreSQLSettings__AdminConnectionString
      remoteRef:
        key: postgresql-admin-connstr
    - secretKey: PostgreSQLSettings__ConnectionString
      remoteRef:
        key: postgresql-connstr
    - secretKey: OrganizationNotificationAddressSettings__UpdateEndpoint
      remoteRef:
        key: kof-reception-address
    - secretKey: OrganizationNotificationAddressSettings__ChangesLogEndpoint
      remoteRef:
        key: kof-sync-address
