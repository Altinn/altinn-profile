apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: profile-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    # Created by the Vault operator as <vault-name>-secret-store. Kustomize doesn't know
    # this reference, so the prefixed name is written out in full.
    name: altinn-profile-secret-store
  target:
    creationPolicy: Owner
  data:
    - secretKey: PostgreSQLSettings__AdminConnectionString
      remoteRef:
        key: postgresql-admin-connstr
    - secretKey: PostgreSQLSettings__ConnectionString
      remoteRef:
        key: postgresql-connstr
    - secretKey: OrganizationNotificationAddressSettings__UpdateEndpoint
      remoteRef:
        key: kof-reception-address
    - secretKey: OrganizationNotificationAddressSettings__ChangesLogEndpoint
      remoteRef:
        key: kof-sync-address
    - secretKey: PLATFORM_KEYVAULT_URI
      remoteRef:
        key: platform-keyvault-uri
---
# The platform signing certificate, from the platform's central store instead of the product
# vault. Name and key match what the deployment and the migration job mount at /accesstoken.
# key secret/ returns the full certificate with the private key (cert/ is the public part only),
# and Base64 decoding makes the Secret hold the binary .pfx.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accesstoken
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: central-accesstoken-store
  target:
    name: accesstoken
    creationPolicy: Owner
  data:
    - secretKey: accesstokencredentials.pfx
      remoteRef:
        key: secret/accesstoken
        decodingStrategy: Base64
