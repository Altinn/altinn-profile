apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-profile
resources:
  - 01-identity.yaml
  - 02-db-migration.yaml

# The environment ConfigMap is created here (pre-deploy) and consumed by both the
# migration job and the runtime deployment, which is applied after this stage.
configMapGenerator:
  - name: environment
    envs:
      - ./config/environment.env

generatorOptions:
  disableNameSuffixHash: true
