info:
  name: Lookup org notificationAddresses
  type: http
  seq: 7

http:
  method: POST
  url: "{{ProfileBaseAddress}}/api/v1/organizations/notificationaddresses/lookup"
  body:
    type: json
    data: |-
      {
          "organizationNumbers": [ "{{orgNumber}}" ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
