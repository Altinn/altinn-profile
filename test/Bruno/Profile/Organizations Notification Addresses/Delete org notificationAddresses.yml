info:
  name: Delete org notificationAddresses
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{ProfileBaseAddress}}/api/v1/organizations/{{Party_OrgNo}}/notificationaddresses/mandatory/120695"
  headers:
    - name: Authorization
      value: Bearer {{BearerToken}}
    - name: PlatformAccessToken
      value: "{{AccessToken}}"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
