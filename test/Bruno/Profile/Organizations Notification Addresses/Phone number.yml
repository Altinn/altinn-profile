info:
  name: Phone number
  type: http
  seq: 3

http:
  method: POST
  url: "{{ProfileBaseAddress}}/api/v1/organizations/{{Party_OrgNo}}/notificationaddresses/mandatory"
  body:
    type: json
    data: |-
      {
          "phone": "91111112",
          "countryCode": "+47"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: await bru.runRequest("TokenGenerator/portal user")

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
