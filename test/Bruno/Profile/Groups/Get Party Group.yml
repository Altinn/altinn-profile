info:
  name: Get Party Group
  type: http
  seq: 4

http:
  method: GET
  url: "{{ProfileBaseAddress}}/api/v1/users/current/party-groups/{{GroupId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: await bru.runRequest("TokenGenerator/portal user")

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
