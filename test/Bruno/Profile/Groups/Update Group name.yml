info:
  name: Update Group name
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{ProfileBaseAddress}}/api/v1/users/current/party-groups/{{GroupId}}"
  body:
    type: json
    data: |-
      {
        "name": "Kunder"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: await bru.runRequest("TokenGenerator/portal user")

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
