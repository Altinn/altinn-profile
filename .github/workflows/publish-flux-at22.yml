name: Publish to AT22 (Flux)
run-name: Publish ${{ github.sha }} to AT22

# AT22 entry point for the generic publish flow in publish-flux.yml.
# Every push to this branch publishes to AT22; it can also be run manually.
on:
  push:
    branches:
      - feat/workshop-dis
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: AT22
    uses: ./.github/workflows/publish-flux.yml
    with:
      environment: at22
    # The called workflow's jobs can only narrow these, so they must cover the maximum it needs.
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
