name: Build Flux artifacts (reusable)

# Builds everything a deploy needs for one branch or release tag, once, independent of
# environment. Nothing is deployed from here: an environment gets the result by moving its tag
# onto it (promote-flux.yml). Callers always run from main, so the Azure login is the existing
# main-branch credential; the ref to build is an input, not the ref the workflow runs on.
#
#   release tag vX.Y.Z  ->  image tag X.Y.Z                      (a release)
#   any branch          ->  image tag <branch-slug>-<short sha>  (main-abc1234, hotfix-fix-x-abc1234)
#
#   1. app image         -> GHCR  <image tag>   (not rebuilt if that tag already exists: tags are immutable)
#   2. deploy/manifests  -> ACR   profile/manifests, tagged <short sha> and <image tag>
#   3. deploy/syncroot   -> ACR   profile/syncroot,  tagged <short sha> and <image tag>
#
# The artifacts contain the overlays of every environment, and the {{IMAGE_TAG}} placeholder in
# deploy/manifests is replaced with the image tag.

on:
  workflow_call:
    inputs:
      ref_type:
        description: Whether ref_name is a branch or a tag.
        type: string
        required: true
      ref_name:
        description: Branch or release tag to build, e.g. main, hotfix/fix-x or v1.4.0.
        type: string
        required: true
      sha:
        description: Commit to build. Pins the build when the branch may move during the run; empty means the tip of ref_name.
        type: string
        default: ''
      restrict_ref:
        description: Only allow release tags and hotfix/* branches, no other hash builds (tt02, prod).
        type: boolean
        default: false
    outputs:
      image_tag:
        description: Tag of the app image and of the artifacts, e.g. 1.4.0 or main-abc1234.
        value: ${{ jobs.prepare.outputs.image_tag }}
      short_sha:
        description: Short commit sha, the tag every artifact push starts with.
        value: ${{ jobs.prepare.outputs.short_sha }}

env:
  ACR_NAME: altinncr
  IMAGE_NAME: altinn/altinn-profile
  MANIFESTS_ARTIFACT_NAME: profile/manifests
  SYNCROOT_ARTIFACT_NAME: profile/syncroot
  # What every job checks out: the pinned commit, else the branch or tag by name.
  CHECKOUT_REF: ${{ inputs.sha || (inputs.ref_type == 'tag' && format('refs/tags/{0}', inputs.ref_name) || format('refs/heads/{0}', inputs.ref_name)) }}

permissions: {}

jobs:
  prepare:
    name: Resolve what to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Resolve image tag
        id: resolve
        env:
          # Via env, not interpolated into the script, so a crafted ref name can't inject commands.
          REF_TYPE: ${{ inputs.ref_type }}
          REF_NAME: ${{ inputs.ref_name }}
          RESTRICT_REF: ${{ inputs.restrict_ref }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"

          if [ "${REF_TYPE}" = tag ]; then
            if [[ ! "${REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Only release tags (vMAJOR.MINOR.PATCH) can be published, not '${REF_NAME}'."
              exit 1
            fi
            image_tag="${BASH_REMATCH[1]}"
          else
            if [ "${RESTRICT_REF}" = true ] && [[ ! "${REF_NAME}" =~ ^hotfix/.+ ]]; then
              echo "::error::This environment only accepts release tags and hotfix/* branches, not '${REF_NAME}'."
              exit 1
            fi
            # OCI tags allow [A-Za-z0-9_.-] only (max 128), so slashes and other characters become hyphens.
            slug="$(printf '%s' "${REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | cut -c1-60 | sed -E 's/^[-.]+//; s/[-.]+$//')"
            [ -n "${slug}" ] || slug=ref
            image_tag="${slug}-${short_sha}"
          fi

          echo "Building ${REF_NAME} as ${image_tag}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      # Only a warning, never a failure. Runs after the short sha above is computed: fetching the
      # full history changes how many characters git abbreviates to, and the artifact tags must
      # use the abbreviation of the shallow checkout that build-push-image sees.
      - name: Warn if the hotfix branch was not cut from a release
        if: inputs.ref_type == 'branch' && startsWith(inputs.ref_name, 'hotfix/')
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: |
          set -uo pipefail
          main_ref='+refs/heads/main:refs/remotes/origin/main'
          if ! git fetch --quiet --tags --unshallow origin "${main_ref}" 2>/dev/null && ! git fetch --quiet --tags origin "${main_ref}" 2>/dev/null; then
            echo "::notice::Could not fetch history, skipping the check that ${REF_NAME} was cut from a release."
            exit 0
          fi
          base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
          if [ -z "${base}" ]; then
            echo "::warning::${REF_NAME} shares no history with main."
            exit 0
          fi
          if git tag --points-at "${base}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "${REF_NAME} was cut from release $(git tag --points-at "${base}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)."
          else
            nearest="$(git describe --tags --match 'v[0-9]*' "${base}" 2>/dev/null || echo 'no release found')"
            echo "::warning::${REF_NAME} was not cut from a release tag: it branches off main at $(git rev-parse --short "${base}") (${nearest}). It includes everything merged to main up to there, not only the fix. Cut hotfixes from the release running in prod: git switch -c hotfix/<name> vX.Y.Z"
          fi

  build-image:
    name: Build and push app image
    needs: prepare
    # The same ref can be built by several runs at once. One build per image tag at a time: a
    # later job then finds the image and skips.
    concurrency:
      group: build-image-${{ needs.prepare.outputs.image_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          # A tag is built once. Re-running a build (or publishing the same release again)
          # must not replace an image that is already deployed somewhere.
          if docker manifest inspect "${image}" >/dev/null 2>&1; then
            echo "::notice::${image} already exists, not rebuilding"
            exit 0
          fi
          docker build --tag "${image}" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" .
          docker push "${image}"

  publish-artifacts:
    name: Publish manifests and syncroot artifacts
    needs: [prepare, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Set the image tag in the manifests
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          # build-push-image tags the artifact with `git rev-parse --short HEAD`, which the extra
          # tag below is moved from, so this checkout has to be the one that was resolved.
          [ "${SHORT_SHA}" = "$(git rev-parse --short HEAD)" ] \
            || { echo "::error::Resolved sha ${SHORT_SHA} differs from the short sha of this checkout"; exit 1; }

          grep -rlF '{{IMAGE_TAG}}' deploy/manifests | xargs sed -i "s/{{IMAGE_TAG}}/${IMAGE_TAG}/g"

          if grep -rF '{{IMAGE_TAG}}' deploy/manifests; then
            echo "::error::Unreplaced {{IMAGE_TAG}} placeholder left in deploy/manifests"
            exit 1
          fi

      - name: Push manifests artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@523f141da4f116fdd7331585396d83a5d7ade7ea # main
        with:
          image_name: ${{ env.MANIFESTS_ARTIFACT_NAME }}
          workdir: ./deploy/manifests
          acr_name: ${{ env.ACR_NAME }}
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

      - name: Tag manifests artifact with the image tag
        uses: Altinn/altinn-platform/actions/flux/retag-image@523f141da4f116fdd7331585396d83a5d7ade7ea # main
        with:
          image_name: ${{ env.MANIFESTS_ARTIFACT_NAME }}
          from_tag: ${{ needs.prepare.outputs.short_sha }}
          tag: ${{ needs.prepare.outputs.image_tag }}
          workdir: ./deploy/manifests
          acr_name: ${{ env.ACR_NAME }}
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

      # After the manifests, so a syncroot never points at a manifests artifact that doesn't exist yet.
      - name: Push syncroot artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@523f141da4f116fdd7331585396d83a5d7ade7ea # main
        with:
          image_name: ${{ env.SYNCROOT_ARTIFACT_NAME }}
          workdir: ./deploy/syncroot
          acr_name: ${{ env.ACR_NAME }}
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

      - name: Tag syncroot artifact with the image tag
        uses: Altinn/altinn-platform/actions/flux/retag-image@523f141da4f116fdd7331585396d83a5d7ade7ea # main
        with:
          image_name: ${{ env.SYNCROOT_ARTIFACT_NAME }}
          from_tag: ${{ needs.prepare.outputs.short_sha }}
          tag: ${{ needs.prepare.outputs.image_tag }}
          workdir: ./deploy/syncroot
          acr_name: ${{ env.ACR_NAME }}
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

      - name: Summary
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          {
            echo "### Built ${IMAGE_TAG}"
            echo "- App image: \`ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Manifests: \`${ACR_NAME}.azurecr.io/${MANIFESTS_ARTIFACT_NAME}\` tags \`${IMAGE_TAG}\`, \`${SHORT_SHA}\`"
            echo "- Syncroot: \`${ACR_NAME}.azurecr.io/${SYNCROOT_ARTIFACT_NAME}\` tags \`${IMAGE_TAG}\`, \`${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
